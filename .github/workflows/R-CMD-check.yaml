# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Work is pushed to dev, which the dev to main pull request collects, so the
# push runs stand in for pull request runs. kelpbio and kelpbiodata are
# installed from their main branches here rather than as Remotes, which would
# override the commits scripts/deploy.R and the Dockerfile pin.
on:
  push:
    branches: [main, dev]

name: R-CMD-check.yaml

permissions: read-all

# A new push to a branch cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            any::rcmdcheck
            HakaiInstitute/kelpbio
            HakaiInstitute/kelpbiodata
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
