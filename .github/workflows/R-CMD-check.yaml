# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Runs on pull requests to main, against kelpbio and kelpbiodata from their dev
# branches on GitHub (installed here rather than as Remotes, so local builds
# keep the locally installed kelpbio and kelpbiodata).
on:
  pull_request:
    branches: main

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            HakaiInstitute/kelpbio@dev
            HakaiInstitute/kelpbiodata@dev
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
